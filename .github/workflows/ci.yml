name: CI

on:
  push:
    branches: [main, Dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 先算出这次改动了哪些部分，再按需触发下游任务：
  # 只改前端就跑前端，只改核心就跑核心；无法确定基线（首个推送、强推）时全量运行。
  changes:
    name: 变更范围
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.scope.outputs.core }}
      ui: ${{ steps.scope.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: scope
        name: Detect changed areas
        shell: bash
        run: |
          set -euo pipefail
          core=false
          ui=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            core=true; ui=true
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              base_ref="${{ github.base_ref }}"
              git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
              base="$(git merge-base "origin/$base_ref" HEAD)"
            else
              base="${{ github.event.before }}"
            fi

            if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              core=true; ui=true
            else
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                case "$f" in
                  .github/workflows/ci.yml) core=true; ui=true ;;
                  src/ui/*|tests/ui.tests/*|version.txt) ui=true ;;
                  src/*|tests/core_tests.cpp|tests/CMakeLists.txt|\
                  CMakeLists.txt|CMakePresets.json|build_amd64.bat|\
                  KeySecBox.sln|KeySecBox.DLL.vcxproj) core=true ;;
                esac
              done < <(git diff --name-only "$base" HEAD)
            fi
          fi

          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "变更范围：core=$core ui=$ui"

  core:
    name: 核心 C++ / ctest (${{ matrix.config }})
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_SUPPRESS_REGENERATION=ON

      - name: Build core + tests
        run: cmake --build build --config ${{ matrix.config }} --target ksbox_tests

      - name: Run core tests
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

  ui:
    name: WinUI 3 前端 (Release x64)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build UI
        run: dotnet build src/ui/KeySecBox.UI.csproj -c Release -p:Platform=x64

  ui-tests:
    name: 前端逻辑测试
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run tests
        run: dotnet run --project tests/ui.tests/UiTests.csproj -c Release
